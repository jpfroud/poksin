name: Poksin CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check:quick
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: Production E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependencies, secrets and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Audit both npm lockfiles
        run: |
          npm audit --audit-level=high
          npm audit --prefix tooling/gstack --audit-level=high
      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --log-opts=HEAD /workspace
      - name: Scan application source with Semgrep
        run: |
          docker run --rm --network none --workdir /src \
            --volume "$GITHUB_WORKSPACE/src:/src/application:ro" \
            --volume "$GITHUB_WORKSPACE/.github/semgrep.yml:/src/policy.yml:ro" \
            docker.io/semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d \
            semgrep scan --config policy.yml --metrics off --disable-version-check --strict --error application

  gate:
    name: poksin-ci
    if: ${{ always() }}
    needs: [quality, e2e, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require all mandatory jobs to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          printf 'quality=%s\ne2e=%s\nsecurity=%s\n' "$QUALITY" "$E2E" "$SECURITY"
          [[ "$QUALITY" == success && "$E2E" == success && "$SECURITY" == success ]]
