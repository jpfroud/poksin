apiVersion: v1
kind: ServiceAccount
metadata:
  name: poksin
  labels:
    app.kubernetes.io/name: poksin
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poksin-data
  labels:
    app.kubernetes.io/name: poksin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poksin
  labels:
    app.kubernetes.io/name: poksin
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: poksin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poksin
    spec:
      serviceAccountName: poksin
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: poksin
          image: poksin-release-image
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: '0.0.0.0'
            - name: PORT
              value: '8080'
            - name: POKSIN_DB
              value: /var/lib/poksin/poksin.sqlite
            - name: POKSIN_SECURE_COOKIES
              value: '1'
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /var/lib/poksin
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: poksin-data
---
apiVersion: v1
kind: Service
metadata:
  name: poksin
  labels:
    app.kubernetes.io/name: poksin
spec:
  selector:
    app.kubernetes.io/name: poksin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: poksin
  labels:
    app.kubernetes.io/name: poksin
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  to:
    kind: Service
    name: poksin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
